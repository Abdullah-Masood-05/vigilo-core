[package]
name = "vigilo-core"
version = "0.2.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "High-performance multimodal exam proctoring and behavioral stream fusion engine in pure Rust. Zero UI, zero browser, zero Tauri."

[lib]
name = "vigilo_core"
path = "src/lib.rs"

[features]
default = []
gpu-directml = ["ort/directml"]
gpu-cuda = ["ort/cuda"]
gpu-coreml = ["ort/coreml"]

[[bin]]
name = "detect-cli"
path = "src/bin/detect-cli.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }

arc-swap = "1"
crossbeam-channel = "0.5"
image = "0.25"
fast_image_resize = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Inference: statically linked ONNX Runtime pinned to 2.0.0-rc.12.
ort = { version = "2.0.0-rc.12", default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-native",
    "api-24",
] }
ndarray = "0.17"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
